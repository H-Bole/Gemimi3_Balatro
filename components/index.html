
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>小丑牌 - Balatro Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
      :root {
        --balatro-red: #FE5F55;
        --balatro-blue: #009ddc;
        --balatro-orange: #f0932b;
        --balatro-dark: #333;
        --balatro-bg: #2c3e50;
      }

      body {
        background-color: #111;
        overflow: hidden; /* 禁止任何全局滚动 */
        font-family: 'ZCOOL QingKe HuangYou', 'VT323', monospace;
        user-select: none;
        image-rendering: pixelated;
        overscroll-behavior: none; /* 阻止橡皮筋效果 */
      }

      /* 迷幻背景 (Psychedelic Background) */
      .swirl-bg {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: repeating-conic-gradient(
          from 0deg,
          #2c3e50 0deg 20deg,
          #34495e 20deg 40deg,
          #212f3c 40deg 60deg
        );
        animation: rotate 60s linear infinite;
        opacity: 0.6;
        z-index: 0;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* CRT 屏幕特效 */
      .crt-scanlines {
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.1) 50%
        );
        background-size: 100% 4px;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
      }

      .crt-flicker {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.02);
        opacity: 0;
        pointer-events: none;
        z-index: 51;
        animation: flicker 0.15s infinite;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 40;
      }

      @keyframes flicker {
        0% { opacity: 0.02; }
        5% { opacity: 0.05; }
        10% { opacity: 0.01; }
        100% { opacity: 0.02; }
      }

      /* --- 卡牌动画核心修复 --- */
      .card-wrapper {
        transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        will-change: transform;
      }

      /* 只有在非选中状态下，Hover 才会生效 */
      .card-wrapper:not(.selected):hover {
        transform: translateY(-15px) rotate(1deg);
        z-index: 20;
      }

      /* 选中状态强制位移，使用 !important 覆盖 hover */
      .card-wrapper.selected {
        transform: translateY(-30px) !important;
        z-index: 30;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
      }
      
      /* 激活/计分状态发光特效 */
      @keyframes pulse-glow {
        0% { box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8); transform: scale(1.1); }
        50% { box-shadow: 0 0 25px 8px rgba(255, 255, 255, 1); transform: scale(1.15); }
        100% { box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8); transform: scale(1.1); }
      }
      .active-glow {
        animation: pulse-glow 0.6s infinite alternate;
        z-index: 100 !important;
        border-color: white !important;
      }

      /* 复古滚动条 - 虽然我们尽量避免滚动，但如果必须滚动，样式要好看 */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
      ::-webkit-scrollbar-thumb { 
        background: #f0932b; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover { background: #e67e22; }

      .text-shadow-retro {
        text-shadow: 3px 3px 0px #000;
      }
      
      /* 计分板动画 - 入场 */
      @keyframes score-enter {
        0% { transform: translateY(50px) scale(0.8); opacity: 0; }
        100% { transform: translateY(0px) scale(1); opacity: 1; }
      }
      .animate-score-enter {
        animation: score-enter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* 版本特效 (Editions) */
      @keyframes foil-shine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .edition-foil {
        background: linear-gradient(135deg, transparent 25%, rgba(255,255,255,0.3) 50%, transparent 75%) !important;
        background-size: 200% 200% !important;
        animation: foil-shine 3s linear infinite;
        box-shadow: 0 0 10px rgba(0, 0, 100, 0.5);
      }
      
      @keyframes holo-pulse {
        0% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
        50% { box-shadow: 0 0 15px rgba(0, 0, 255, 0.7); }
        100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
      }
      .edition-holographic {
        animation: holo-pulse 2s infinite;
        border: 2px solid rgba(255, 100, 100, 0.8) !important;
      }

      @keyframes poly-colors {
        0% { box-shadow: 0 0 10px #ff0000; }
        20% { box-shadow: 0 0 10px #ffff00; }
        40% { box-shadow: 0 0 10px #00ff00; }
        60% { box-shadow: 0 0 10px #00ffff; }
        80% { box-shadow: 0 0 10px #0000ff; }
        100% { box-shadow: 0 0 10px #ff00ff; }
      }
      .edition-polychrome {
        animation: poly-colors 3s linear infinite;
      }

      .edition-negative {
        filter: invert(1) hue-rotate(180deg);
      }

      /* 增强 (Enhancements) */
      .enhance-stone {
        background-color: #7f8c8d !important;
        border: 2px solid #555 !important;
      }
      .enhance-gold {
        background-color: #f1c40f !important;
        border-color: #d35400 !important;
      }
      .enhance-gold::before {
        content: "$";
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 4rem;
        color: rgba(255,255,255,0.2);
        font-weight: bold;
        pointer-events: none;
      }
      .enhance-steel {
        background-color: #bdc3c7 !important;
        border-color: #7f8c8d !important;
      }
      .enhance-glass {
        background-color: rgba(255,255,255,0.9) !important;
        opacity: 0.95;
      }
      .enhance-wild {
        background: conic-gradient(from 0deg, #FE5F55, #009ddc, #2c3e50, #f0932b, #FE5F55) !important;
        opacity: 0.9;
      }

      /* 火焰文字 */
      @keyframes fire-flicker {
        0% { text-shadow: 0 0 4px #fefcc9, 2px -2px 6px #feec85, -4px -4px 10px #ffae34, 4px -8px 14px #ec760c; }
        100% { text-shadow: 0 0 4px #fefcc9, 2px -2px 6px #feec85, -3px -5px 12px #ffae34, 3px -9px 16px #ec760c; }
      }
      .text-fire {
        color: #fff;
        animation: fire-flicker 0.1s infinite alternate;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "@/": "./"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
