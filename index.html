<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小丑牌 - Balatro Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
      :root {
        --balatro-red: #FE5F55;
        --balatro-blue: #009ddc;
        --balatro-orange: #f0932b;
        --balatro-dark: #333;
        --balatro-bg: #2c3e50;
      }

      body {
        background-color: #111;
        overflow: hidden;
        font-family: 'ZCOOL QingKe HuangYou', 'VT323', monospace;
        user-select: none;
        image-rendering: pixelated;
      }

      /* Psychedelic Background */
      .swirl-bg {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: repeating-conic-gradient(
          from 0deg,
          #2c3e50 0deg 20deg,
          #34495e 20deg 40deg,
          #212f3c 40deg 60deg
        );
        animation: rotate 60s linear infinite;
        opacity: 0.6;
        z-index: 0;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* CRT Effects */
      .crt-scanlines {
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.1) 50%
        );
        background-size: 100% 4px;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
      }

      .crt-flicker {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.02);
        opacity: 0;
        pointer-events: none;
        z-index: 51;
        animation: flicker 0.15s infinite;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 40;
      }

      @keyframes flicker {
        0% { opacity: 0.02; }
        5% { opacity: 0.05; }
        10% { opacity: 0.01; }
        100% { opacity: 0.02; }
      }

      /* Card & UI Styles */
      .pixel-corners {
        box-shadow: 
          -4px 0 0 0 #000,
          4px 0 0 0 #000,
          0 -4px 0 0 #000,
          0 4px 0 0 #000;
        margin: 4px;
      }

      .card-wrapper {
        transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .card-wrapper:hover {
        transform: translateY(-15px) rotate(1deg);
        z-index: 20;
      }
      .card-wrapper.selected {
        transform: translateY(-30px);
        z-index: 30;
      }

      /* Retro Scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: #2c3e50; }
      ::-webkit-scrollbar-thumb { 
        background: #f0932b; 
        border: 2px solid #000;
      }
      ::-webkit-scrollbar-thumb:hover { background: #e67e22; }

      .text-shadow-retro {
        text-shadow: 3px 3px 0px #000;
      }
      
      .text-outline {
        -webkit-text-stroke: 1px black; 
        paint-order: stroke fill;
      }

      @keyframes float-score {
        0% { transform: translateY(20px) scale(0.8); opacity: 0; }
        20% { transform: translateY(0px) scale(1.1); opacity: 1; }
        100% { transform: translateY(-50px) scale(1); opacity: 0; }
      }
      .animate-score-float {
        animation: float-score 2s forwards;
      }

      /* Editions Animations */
      @keyframes foil-shine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .edition-foil {
        background: linear-gradient(135deg, transparent 20%, rgba(255,255,255,0.4) 25%, transparent 30%) !important;
        background-size: 200% 200% !important;
        animation: foil-shine 3s linear infinite;
      }

      @keyframes holo-shine {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
      }
      .edition-holo {
        box-shadow: 0 0 10px rgba(0, 157, 220, 0.6), inset 0 0 10px rgba(0, 157, 220, 0.3);
        border-color: #009ddc !important;
      }

      .edition-polychrome {
        animation: holo-shine 3s linear infinite;
        box-shadow: 0 0 15px rgba(255,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.5);
      }

      /* Enhancement Textures */
      .enhance-stone {
        background-color: #7f8c8d !important;
        background-image: url("data:image/svg+xml,%3Csvg width='6' height='6' viewBox='0 0 6 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23000000' fill-opacity='0.2' fill-rule='evenodd'%3E%3Cpath d='M5 0h1L0 6V5zM6 5v1H5z'/%3E%3C/g%3E%3C/svg%3E") !important;
      }
      .enhance-gold {
        background-color: #f1c40f !important;
        border-color: #f39c12 !important;
      }
      .enhance-steel {
        background-color: #95a5a6 !important;
        border-color: #7f8c8d !important;
      }
      .enhance-glass {
        background-color: rgba(255,255,255,0.9) !important;
        border-color: #aed6f1 !important;
        opacity: 0.9;
      }
      .enhance-wild {
        background: conic-gradient(from 0deg, #FE5F55, #009ddc, #000, #f0932b, #FE5F55) !important;
        opacity: 0.9;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
